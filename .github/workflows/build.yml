name: jumpa build

# Unit tests plus a debug APK on every push to main. Signed releases come
# later, once the jumpa signing key exists as repository secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jumpa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

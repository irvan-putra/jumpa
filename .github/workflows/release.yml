name: jumpa signed release

# Manual only. patuh source gate first, then builds the release APK, signs it
# with the jumpa key from repository secrets, verifies the signature and
# package, byte-checks the candidate via patuh, publishes a GitHub
# pre-release, then post-publish verifies the live release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consistency:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@7f09acc8d270fdd59473c2a31a599ebafde25441
    with:
      app: jumpa
      published: false

  release:
    needs: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      # First signed build prints the digest; pin it here afterwards.
      EXPECTED_CERT_SHA256: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Read version
        id: v
        run: |
          VER=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build and sign
        env:
          JUMPA_KEYSTORE_B64: ${{ secrets.JUMPA_KEYSTORE_B64 }}
          JUMPA_STORE_PASSWORD: ${{ secrets.JUMPA_STORE_PASSWORD }}
          JUMPA_KEY_ALIAS: ${{ secrets.JUMPA_KEY_ALIAS }}
          JUMPA_KEY_PASSWORD: ${{ secrets.JUMPA_KEY_PASSWORD }}
        run: |
          echo "$JUMPA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jumpa.jks"
          export JUMPA_KEYSTORE_FILE="$RUNNER_TEMP/jumpa.jks"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/jumpa.jks"
      - name: Verify signature, package and permissions
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.v.outputs.version }}"
          APK="app/build/outputs/apk/release/jumpa-v${VER}-release.apk"
          test -f "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' /tmp/cert.txt | awk '{print toupper($NF)}')
          echo "cert digest extracted: [$GOT]"
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            test "$GOT" = "$EXPECTED_CERT_SHA256"
            echo "cert pin matches"
          else
            echo "no cert pin set yet (first signed build); digest above becomes the pin"
          fi
          "$BT/aapt" dump badging "$APK" | head -3
          "$BT/aapt" dump badging "$APK" | grep -F "package: name='com.vanipy.jumpa'"
          "$BT/aapt" dump badging "$APK" | grep -F "versionName='${VER}'"
          if "$BT/apksigner" verify --print-certs "$APK" | grep -q 'DEBUG'; then exit 1; fi
          if "$BT/aapt" dump permissions "$APK" | grep -q 'uses-permission'; then exit 1; fi
          cp "$APK" "jumpa-v${VER}.apk"
          sha256sum "jumpa-v${VER}.apk" | tee "jumpa-v${VER}.apk.sha256"
      - name: Upload candidate APK for the byte check
        uses: actions/upload-artifact@v4
        with:
          name: candidate-apk
          path: |
            jumpa-v${{ steps.v.outputs.version }}.apk
            jumpa-v${{ steps.v.outputs.version }}.apk.sha256
          retention-days: 1

  candidate-bytes:
    needs: release
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@7f09acc8d270fdd59473c2a31a599ebafde25441
    with:
      app: jumpa
      published: false
      candidate_apk_artifact: candidate-apk

  publish:
    needs: [candidate-bytes, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with: { name: candidate-apk, path: dist }
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER="${{ needs.release.outputs.version }}"
          cp "dist/jumpa-v${VER}.apk" "dist/jumpa-v${VER}.apk.sha256" .
          cat > notes.md <<NOTES
          jumpa ${VER}: a private relationship notebook. People carry dated company and organization history (empty end date means current), dated notes, and promises with optional due dates. Link a phone contact through the system picker without giving jumpa your address book: zero Android permissions, read-only, jumpa never edits phone contacts. Demo mode ships fictional people so the app can be shown without exposing anyone real. Everything stays on the phone: no network, no accounts, no sync.

          Prototype limits are in the README: the picker's read grant is temporary, dates are loose text, and there is no backup or export yet.

          SHA-256 of the APK is in the attached .sha256 file.
          NOTES
          gh release create "v${VER}" "jumpa-v${VER}.apk" "jumpa-v${VER}.apk.sha256" \
            --title "jumpa ${VER}" --notes-file notes.md --prerelease --target "${GITHUB_SHA}"

  verify:
    needs: publish
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@7f09acc8d270fdd59473c2a31a599ebafde25441
    with:
      app: jumpa
      published: true

name: patuh consistency gate

# Family consistency checks from irvan-putra/patuh, qualified for jumpa.
# On every push to main: source gate on the exact pushed tree.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@f573dfb242b3bc57f919416cff2b93d30381d39d
    with:
      app: jumpa
      published: false

name: patuh consistency gate

# Family consistency checks from irvan-putra/patuh, qualified for jumpa.
# On every push to main: source gate on the exact pushed tree.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@3d9be2e1d971e3f9e3f748a2fb04931951e9f974
    with:
      app: jumpa
      published: false

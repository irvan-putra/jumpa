name: patuh consistency gate

# Family consistency checks from irvan-putra/patuh, qualified for jumpa.
# On every push to main: source gate on the exact pushed tree.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@4e07bf7f13cf57ddbfa686908a707821387b9cf9
    with:
      app: jumpa
      published: false

name: patuh consistency gate

# Family consistency checks from irvan-putra/patuh, qualified for jumpa.
# On every push to main: source gate on the exact pushed tree.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@7da4a2e2b75b082518481bb587cc13f75a40e7b9
    with:
      app: jumpa
      published: false

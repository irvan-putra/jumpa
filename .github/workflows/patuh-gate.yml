name: patuh consistency gate

# Family consistency checks from irvan-putra/patuh, qualified for jumpa.
# On every push to main: source gate on the exact pushed tree.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@45bf9b340bc27f6bcafbe909204d5a717c072ab1
    with:
      app: jumpa
      published: false
